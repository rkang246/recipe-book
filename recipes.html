<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Recipes</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --panel-2: #222632;
    --text: #e7e9ee;
    --muted: #9aa0ad;
    --line: #2c303c;
    --accent: #ffa94d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  header { padding: 28px 24px 8px; max-width: 1280px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { color: var(--muted); font-size: 0.95rem; margin: 0; }

  .controls {
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .control-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .control-label {
    color: var(--muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-right: 4px;
    min-width: 70px;
  }
  .search {
    flex: 1;
    min-width: 200px;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.9rem;
  }
  .search:focus { outline: none; border-color: var(--accent); }

  .pill {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.12s ease;
    user-select: none;
  }
  .pill:hover { border-color: var(--accent); }
  .pill.off { opacity: 0.35; }
  .cat-toggle::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    background: var(--c, var(--muted));
  }
  .clear-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .clear-btn:hover { color: var(--text); border-color: var(--accent); }

  main { max-width: 1280px; margin: 0 auto; padding: 8px 24px 60px; }

  .section {
    background: linear-gradient(90deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-left: 4px solid var(--c, var(--muted));
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 20px;
  }
  .section h2 {
    margin: 0 0 4px;
    font-size: 1.1rem;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .section h2 .count { font-size: 0.75rem; color: var(--muted); font-weight: 500; }
  .section .blurb { color: var(--muted); font-size: 0.82rem; margin: 0 0 12px; }
  .section.collapsed h2 { margin-bottom: 0; }
  .section.collapsed .blurb, .section.collapsed .grid { display: none; }

  .caret {
    display: inline-block;
    width: 0.9em;
    color: var(--muted);
    transition: transform 0.15s ease;
  }
  .caret::before { content: "\25BE"; font-size: 0.85em; }
  .collapsed .caret { transform: rotate(-90deg); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--c, var(--muted));
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card .c-name { font-weight: 700; font-size: 1.02rem; line-height: 1.25; }
  .card .c-desc { color: var(--text); opacity: 0.82; font-size: 0.85rem; margin-top: 4px; }

  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 0.72rem; color: var(--muted); }
  .tag { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .tag.cat { color: var(--c); border-color: var(--c); }
  .tag.cleanup { color: #b2f2bb; border-color: rgba(81,207,102,0.5); }
  .tag.equip { color: #ffd8a8; border-color: rgba(255,146,43,0.5); }

  /* ---- Ingredient multi-search ---- */
  .ing-search {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 520px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 5px 10px;
    cursor: text;
  }
  .ing-search:focus-within { border-color: var(--accent); }
  .ing-search input {
    flex: 1;
    min-width: 120px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 0.9rem;
    padding: 3px 4px;
  }
  .ing-search input:focus { outline: none; }
  .chip {
    background: var(--accent);
    color: #0f1117;
    border-radius: 999px;
    padding: 2px 6px 2px 10px;
    font-size: 0.82rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .chip button {
    background: none; border: none; color: #0f1117;
    cursor: pointer; font-size: 0.9rem; padding: 0 2px; line-height: 1;
  }
  .suggest {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    margin: 0; padding: 4px;
    list-style: none;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    z-index: 5;
    display: none;
  }
  .suggest.open { display: block; }
  .suggest li {
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.88rem;
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .suggest li.active, .suggest li:hover { background: var(--bg); }
  .suggest li .via { color: var(--muted); font-size: 0.76rem; }
  .suggest li .n { color: var(--muted); font-size: 0.76rem; white-space: nowrap; }
  .card .c-has { margin-top: 6px; font-size: 0.78rem; color: #b2f2bb; }

  .empty { color: var(--muted); text-align: center; padding: 40px 0; }

  /* ---- Recipe detail overlay ---- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: 30px 12px;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .detail {
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 4px solid var(--c, var(--accent));
    border-radius: 14px;
    max-width: 760px;
    width: 100%;
    padding: 20px 22px 80px;
    position: relative;
  }
  .detail .close {
    position: absolute; top: 12px; right: 12px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 999px;
    width: 34px; height: 34px; font-size: 1.1rem; cursor: pointer;
  }
  .detail .close:hover { border-color: var(--accent); }
  .detail h2 { margin: 0 40px 4px 0; font-size: 1.4rem; }
  .detail .d-desc { color: var(--text); opacity: 0.85; margin: 6px 0 0; }
  .detail h3 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); margin: 22px 0 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .times { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .time-box {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; font-size: 0.8rem; color: var(--muted);
  }
  .time-box b { display: block; color: var(--text); font-size: 0.95rem; }

  .servings { display: inline-flex; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; }
  .servings button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 0.95rem;
  }
  .servings button:hover { border-color: var(--accent); }
  .servings span { color: var(--text); font-size: 0.85rem; min-width: 74px; text-align: center; }

  .ing-group { font-size: 0.78rem; color: var(--accent); margin: 10px 0 4px; font-weight: 600; }
  ul.ings, ol.steps, ul.tips { margin: 0; padding: 0; list-style: none; }
  ul.ings li {
    padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 0.92rem;
    display: flex; gap: 8px; align-items: baseline;
  }
  ul.ings li:hover { background: var(--panel-2); }
  ul.ings li::before { content: "\2610"; color: var(--muted); }
  ul.ings li.done { opacity: 0.4; text-decoration: line-through; }
  ul.ings li.done::before { content: "\2611"; }
  ul.ings .qty { font-weight: 600; white-space: nowrap; }
  ul.ings .note { color: var(--muted); font-size: 0.82rem; }

  ol.steps { counter-reset: step; }
  ol.steps li {
    counter-increment: step;
    position: relative;
    padding: 8px 10px 8px 40px;
    margin-bottom: 6px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.92rem;
  }
  ol.steps li::before {
    content: counter(step);
    position: absolute; left: 10px; top: 8px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--c, var(--accent)); color: #0f1117;
    font-size: 0.75rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  ol.steps li.done { opacity: 0.4; }
  ol.steps li.done::before { content: "\2713"; }
  ol.steps li .ask-step {
    float: right;
    margin: -2px -4px 2px 8px;
    background: var(--bg); border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; font-size: 0.72rem; padding: 2px 8px; cursor: pointer;
  }
  ol.steps li .ask-step:hover { color: var(--text); border-color: var(--accent); }

  /* ---- AI chat drawer ---- */
  .chat-fab {
    position: fixed; right: 18px; bottom: 18px;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); color: #0f1117; border: none;
    font-size: 1.4rem; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    z-index: 30;
    transition: transform 0.15s ease;
  }
  .chat-fab:hover { transform: scale(1.06); }
  .chat-fab.hidden { display: none; }
  .chat {
    position: fixed; right: 18px; bottom: 18px;
    width: 360px; height: min(500px, calc(100vh - 36px));
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-top: 3px solid var(--accent);
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.55);
    display: none; flex-direction: column;
    z-index: 30;
  }
  @media (max-width: 600px) {
    .chat { left: 8px; right: 8px; bottom: 8px; width: auto; height: 58vh; }
    .chat-fab { right: 14px; bottom: 14px; }
  }
  .chat.open { display: flex; }
  .chat-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 0.9rem;
  }
  .chat-head .sub { font-size: 0.75rem; }
  .chat-head button {
    background: none; border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; width: 30px; height: 30px; cursor: pointer; flex-shrink: 0;
  }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 8px 12px; border-radius: 12px; font-size: 0.9rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #0f1117; border-bottom-right-radius: 4px; }
  .msg.model { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.error { align-self: center; color: #ffa8a8; font-size: 0.8rem; background: none; }
  .msg.typing { color: var(--muted); }
  .chat-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .chat-form input {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 9px 14px; font-size: 16px;
  }
  .chat-form input:focus { outline: none; border-color: var(--accent); }
  .chat-form button {
    background: var(--accent); color: #0f1117; border: none; border-radius: 999px;
    padding: 0 16px; font-weight: 600; cursor: pointer;
  }
  .chat-form button:disabled { opacity: 0.5; cursor: default; }

  ul.tips li {
    font-size: 0.86rem; color: var(--muted);
    padding-left: 18px; position: relative; margin-bottom: 4px;
  }
  ul.tips li::before { content: "\2192"; position: absolute; left: 0; color: var(--accent); }
  .hint { color: var(--muted); font-size: 0.72rem; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .source { margin-top: 18px; font-size: 0.8rem; color: var(--muted); }
  .source a { color: var(--accent); }

  @media (max-width: 600px) {
    header, .controls, main { padding-left: 14px; padding-right: 14px; }
    .overlay { padding: 0; }
    .detail { border-radius: 0; min-height: 100vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Easy Recipes</h1>
  <p class="sub">Low-effort, low-cleanup cooking — grouped by category. Tap a recipe to open it.</p>
</header>

<div class="controls">
  <div class="control-group">
    <span class="control-label">Search</span>
    <input id="search" class="search" type="search" placeholder="Dish name, cuisine, tag…">
  </div>
  <div class="control-group">
    <span class="control-label">Ingredients</span>
    <div class="ing-search" id="ing-search">
      <span id="chips" style="display:contents"></span>
      <input id="ing-input" type="text" autocomplete="off" placeholder="Type an ingredient, e.g. beef…">
      <ul class="suggest" id="suggest"></ul>
    </div>
    <button class="clear-btn" id="ing-clear">Clear</button>
  </div>
  <div class="control-group" id="cat-filters">
    <span class="control-label">Category</span>
  </div>
  <div class="control-group" id="equip-filters">
    <span class="control-label">Equipment</span>
  </div>
</div>

<main id="main"></main>

<button class="chat-fab" id="chat-fab" aria-label="Ask a question">💬</button>
<div class="chat" id="chat">
  <div class="chat-head">
    <div><b id="chat-title">Ask a cooking question</b><div class="sub" id="chat-sub"></div></div>
    <button id="chat-close" aria-label="Minimize chat">–</button>
  </div>
  <div class="chat-msgs" id="chat-msgs"></div>
  <form class="chat-form" id="chat-form">
    <input id="chat-input" type="text" autocomplete="off" placeholder="e.g. Can I swap the ginger for something?">
    <button type="submit">Send</button>
  </form>
</div>

<div class="overlay" id="overlay">
  <div class="detail" id="detail"></div>
</div>

<script>
// =====================================================================
// CATEGORIES — sections on the page, in display order.
// Add a new entry here only when a recipe needs a category that doesn't exist.
// =====================================================================
const CATEGORIES = [
  { key: "one-bowl",  label: "One Bowl / One Pot", color: "#ffa94d", blurb: "Everything in a single vessel — minimal cleanup." },
  { key: "sheet-pan", label: "Sheet Pan",          color: "#ff8787", blurb: "Toss it on a tray, roast, done." },
  { key: "appetizer", label: "Appetizers & Snacks", color: "#74c0fc", blurb: "Small bites and starters." },
  { key: "side",      label: "Sides",              color: "#8ce99a", blurb: "Easy accompaniments." },
  { key: "dessert",   label: "Desserts",           color: "#e599f7", blurb: "Sweet stuff, still low effort." }
];

// =====================================================================
// DATA — all recipes live here. See CLAUDE.md for the field reference.
// =====================================================================
const DATA = [
  {
    name: "Rice Cooker Gyudon",
    category: "one-bowl",
    description: "Japanese beef-and-onion rice bowl where the rice, beef and sweet-savory sauce all cook together in the rice cooker. Dump, press start, top with an egg.",
    cuisine: "Japanese",
    equipment: ["Rice cooker"],
    cleanup: "Rice cooker pot + cutting board",
    servings: 3,
    time: { prep: 10, cook: 50 },
    tags: ["beef", "rice", "donburi", "hands-off"],
    ingredients: [
      { group: "Base", items: [
        { qty: 2, unit: "rice-cooker cups", item: "Japanese short-grain rice", note: "(~360 ml) rinsed until water runs mostly clear" },
        { qty: null, unit: "", item: "Water", note: "to the 2-cup line, added after the sauce" }
      ]},
      { group: "Sauce", items: [
        { qty: 3, unit: "tbsp", item: "soy sauce" },
        { qty: 2, unit: "tbsp", item: "mirin" },
        { qty: 2, unit: "tbsp", item: "sake", note: "or more mirin / water" },
        { qty: 1, unit: "tbsp", item: "sugar" },
        { qty: 1, unit: "tsp", item: "dashi powder", note: "(hondashi), optional but recommended" },
        { qty: 1, unit: "tsp", item: "grated ginger" }
      ]},
      { group: "Topping layer", items: [
        { qty: 300, unit: "g", item: "shabu-shabu beef", note: "(~2/3 lb) thinly sliced / hot-pot cut ribeye or chuck" },
        { qty: 1, unit: "", item: "yellow onion", note: "halved and thinly sliced" }
      ]},
      { group: "To serve", items: [
        { qty: 3, unit: "", item: "eggs", note: "raw yolks, onsen tamago, or soft-boiled" },
        { qty: 2, unit: "", item: "green onions", note: "sliced" },
        { qty: null, unit: "", item: "Beni shoga (pickled red ginger)", note: "optional" },
        { qty: null, unit: "", item: "Shichimi togarashi", note: "optional" }
      ]}
    ],
    steps: [
      "Rinse the rice in the rice-cooker pot 3–4 times until the water runs mostly clear, then drain well.",
      "Add the soy sauce, mirin, sake, sugar, dashi powder and ginger to the pot FIRST, then top up with water to the 2-cup line. Stir once to dissolve.",
      "Toss the beef with a splash of the sauce from the pot (optional, for more flavor). Spread the sliced onion over the rice, then lay the beef on top in an even layer. Do NOT stir — keeping the toppings on top keeps the rice from going gummy.",
      "Cook on the regular white-rice setting.",
      "When it finishes, let it rest 10 minutes. Break up the beef and gently fold everything together (or scoop beef off the top and serve it over the rice, donburi-style).",
      "Serve in bowls topped with an egg yolk or soft egg, green onions, and beni shoga / shichimi if using."
    ],
    tips: [
      "Look for pre-sliced 'shabu-shabu' or 'hot pot' beef at Japanese/Korean markets — it cooks perfectly in the steam.",
      "Brown rice / mixed-grain settings run longer; stick with white rice for best texture.",
      "Rice a bit wet? Leave it on 'keep warm' with the lid cracked for 5 more minutes.",
      "Doubles easily in a 5.5-cup cooker: 4 cups rice, double everything else."
    ]
  }
];

// =====================================================================
// Rendering — no need to edit below this line to add recipes.
// =====================================================================
const state = {
  q: "",
  cats: new Set(CATEGORIES.map(c => c.key)),
  equip: new Set(),           // empty = no equipment filter
  collapsed: new Set(),
  servings: {},               // slug -> current servings
  done: {},                   // slug -> Set of checked ids
  ings: []                    // selected ingredient chips (all must match)
};
const catMap = Object.fromEntries(CATEGORIES.map(c => [c.key, c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const fmtMin = m => m >= 60 ? `${Math.floor(m / 60)} hr${m % 60 ? " " + (m % 60) + " min" : ""}` : `${m} min`;
const totalTime = r => (r.time?.prep || 0) + (r.time?.cook || 0);

function fmtQty(q) {
  if (q == null) return "";
  if (q >= 20) return String(Math.round(q));
  const whole = Math.floor(q), frac = q - whole;
  const fracs = [[0, ""], [1/4, "¼"], [1/3, "⅓"], [1/2, "½"], [2/3, "⅔"], [3/4, "¾"], [1, ""]];
  let best = fracs[0];
  for (const f of fracs) if (Math.abs(frac - f[0]) < Math.abs(frac - best[0])) best = f;
  const w = best[0] === 1 ? whole + 1 : whole;
  if (Math.abs(frac - best[0]) > 0.06) return (Math.round(q * 10) / 10).toString();
  return (w ? w : "") + best[1] || "0";
}

function haystack(r) {
  return [r.name, r.description, r.cuisine, ...(r.tags || []), ...(r.equipment || []),
    ...r.ingredients.flatMap(g => g.items.map(i => i.item))].join(" ").toLowerCase();
}

// ---- Ingredient matching (substring, plus 1-typo tolerance on word prefixes) ----
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
// 0 = word-prefix match, 1 = substring, 2 = fuzzy (one typo), Infinity = no match
function matchScore(q, text) {
  q = q.toLowerCase(); text = text.toLowerCase();
  const words = text.split(/[^a-z0-9]+/).filter(Boolean);
  if (words.some(w => w.startsWith(q))) return 0;
  if (text.includes(q)) return 1;
  if (q.length >= 3) {
    const tol = q.length >= 7 ? 2 : 1;
    if (words.some(w => lev(q, w.slice(0, q.length)) <= tol)) return 2;
  }
  return Infinity;
}
const allIngs = r => r.ingredients.flatMap(g => g.items);
// Typo tolerance applies to ingredient names only; notes must match exactly.
const ingMatches = (chip, i) => matchScore(chip, i.item) < Infinity || matchScore(chip, i.note || "") <= 1;
const hasIng = (r, chip) => allIngs(r).some(i => ingMatches(chip, i));

// Unique ingredient names across all recipes -> { item, notes, count }
const ING_INDEX = (() => {
  const m = new Map();
  DATA.forEach(r => allIngs(r).forEach(i => {
    const k = i.item.toLowerCase();
    if (k === "water") return;
    if (!m.has(k)) m.set(k, { item: i.item, notes: new Set(), recipes: new Set() });
    if (i.note) m.get(k).notes.add(i.note);
    m.get(k).recipes.add(r.name);
  }));
  return [...m.values()];
})();

function suggestions(q) {
  const chosen = new Set(state.ings.map(c => c.toLowerCase()));
  return ING_INDEX
    .filter(e => !chosen.has(e.item.toLowerCase()))
    .map(e => {
      const sItem = matchScore(q, e.item);
      const via = [...e.notes].find(n => matchScore(q, n) <= 1);
      return { e, score: Math.min(sItem, via ? matchScore(q, via) + 0.5 : Infinity), via: sItem === Infinity ? via : null };
    })
    .filter(x => x.score < Infinity)
    .sort((a, b) => a.score - b.score || b.e.recipes.size - a.e.recipes.size || a.e.item.localeCompare(b.e.item))
    .slice(0, 8);
}

// If the typed word cleanly matches several different ingredients (e.g. "rice" ->
// short-grain rice, jasmine rice), offer the word itself as an "any" option first.
function genericOption(q) {
  q = q.trim().toLowerCase();
  if (q.length < 3 || state.ings.some(c => c.toLowerCase() === q)) return null;
  const hits = ING_INDEX.filter(e => matchScore(q, e.item) === 0);
  if (hits.length < 2) return null;
  const n = DATA.filter(r => hasIng(r, q)).length;
  return { e: { item: q, recipes: { size: n } }, any: true };
}

function visible(r) {
  if (!state.cats.has(r.category)) return false;
  if (state.equip.size && !(r.equipment || []).some(e => state.equip.has(e))) return false;
  if (state.q && !haystack(r).includes(state.q)) return false;
  if (!state.ings.every(c => hasIng(r, c))) return false;
  return true;
}

function metaTags(r) {
  const c = catMap[r.category];
  const t = [];
  if (c) t.push(`<span class="tag cat" style="--c:${c.color}">${esc(c.label)}</span>`);
  if (totalTime(r)) t.push(`<span class="tag">⏱ ${fmtMin(totalTime(r))}</span>`);
  if (r.servings) t.push(`<span class="tag">🍽 ${r.servings} servings</span>`);
  (r.equipment || []).forEach(e => t.push(`<span class="tag equip">${esc(e)}</span>`));
  if (r.cleanup) t.push(`<span class="tag cleanup">🧽 ${esc(r.cleanup)}</span>`);
  if (r.cuisine) t.push(`<span class="tag">${esc(r.cuisine)}</span>`);
  return `<div class="meta">${t.join("")}</div>`;
}

function buildFilters() {
  const cf = document.getElementById("cat-filters");
  CATEGORIES.filter(c => DATA.some(r => r.category === c.key)).forEach(c => {
    const b = document.createElement("span");
    b.className = "pill cat-toggle";
    b.style.setProperty("--c", c.color);
    b.textContent = c.label;
    b.onclick = () => {
      state.cats.has(c.key) ? state.cats.delete(c.key) : state.cats.add(c.key);
      b.classList.toggle("off", !state.cats.has(c.key));
      render();
    };
    cf.appendChild(b);
  });

  const ef = document.getElementById("equip-filters");
  const equip = [...new Set(DATA.flatMap(r => r.equipment || []))].sort();
  if (!equip.length) { ef.style.display = "none"; return; }
  equip.forEach(e => {
    const b = document.createElement("span");
    b.className = "pill off";
    b.textContent = e;
    b.onclick = () => {
      state.equip.has(e) ? state.equip.delete(e) : state.equip.add(e);
      b.classList.toggle("off", !state.equip.has(e));
      render();
    };
    ef.appendChild(b);
  });
  const clr = document.createElement("button");
  clr.className = "clear-btn";
  clr.textContent = "Any";
  clr.onclick = () => {
    state.equip.clear();
    ef.querySelectorAll(".pill").forEach(p => p.classList.add("off"));
    render();
  };
  ef.appendChild(clr);
}

function render() {
  const main = document.getElementById("main");
  let html = "";
  CATEGORIES.forEach(c => {
    const recipes = DATA.filter(r => r.category === c.key && visible(r))
      .sort((a, b) => a.name.localeCompare(b.name));
    if (!recipes.length) return;
    const col = state.collapsed.has(c.key) ? " collapsed" : "";
    html += `<section class="section${col}" style="--c:${c.color}" data-cat="${c.key}">
      <h2><span class="caret"></span>${esc(c.label)} <span class="count">${recipes.length} recipe${recipes.length > 1 ? "s" : ""}</span></h2>
      <p class="blurb">${esc(c.blurb || "")}</p>
      <div class="grid">${recipes.map(r => `
        <div class="card" style="--c:${c.color}" data-slug="${slug(r.name)}">
          <div class="c-name">${esc(r.name)}</div>
          <div class="c-desc">${esc(r.description)}</div>
          ${state.ings.length ? `<div class="c-has">✓ ${state.ings.map(c => esc(allIngs(r).find(i => ingMatches(c, i)).item)).join(" · ")}</div>` : ""}
          ${metaTags(r)}
        </div>`).join("")}
      </div>
    </section>`;
  });
  main.innerHTML = html || `<div class="empty">No recipes match.</div>`;
  main.querySelectorAll(".section h2").forEach(h => h.onclick = () => {
    const k = h.parentElement.dataset.cat;
    state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k);
    h.parentElement.classList.toggle("collapsed");
  });
  main.querySelectorAll(".card").forEach(el => el.onclick = () => { location.hash = el.dataset.slug; });
}

function openDetail(s) {
  const r = DATA.find(x => slug(x.name) === s);
  const ov = document.getElementById("overlay");
  if (!r) { ov.classList.remove("open"); document.body.style.overflow = ""; syncChat(); return; }
  const c = catMap[r.category] || {};
  const serv = state.servings[s] ?? r.servings ?? 1;
  const scale = r.servings ? serv / r.servings : 1;
  const done = state.done[s] ||= new Set();

  const times = [];
  if (r.time?.prep) times.push(`<div class="time-box"><b>${fmtMin(r.time.prep)}</b>prep</div>`);
  if (r.time?.cook) times.push(`<div class="time-box"><b>${fmtMin(r.time.cook)}</b>cook</div>`);
  if (totalTime(r)) times.push(`<div class="time-box"><b>${fmtMin(totalTime(r))}</b>total</div>`);

  const ings = r.ingredients.map((g, gi) => `
    ${g.group ? `<div class="ing-group">${esc(g.group)}</div>` : ""}
    <ul class="ings">${g.items.map((i, ii) => {
      const id = `i${gi}-${ii}`;
      const q = i.qty != null ? `<span class="qty">${fmtQty(i.qty * scale)}${i.unit ? " " + esc(i.unit) : ""}</span>` : "";
      return `<li data-id="${id}" class="${done.has(id) ? "done" : ""}">${q}<span>${esc(i.item)}${i.note ? ` <span class="note">${esc(i.note)}</span>` : ""}</span></li>`;
    }).join("")}</ul>`).join("");

  const steps = r.steps.map((st, si) =>
    `<li data-id="s${si}" class="${done.has("s" + si) ? "done" : ""}"><button class="ask-step" data-step="${si}">💬 Ask</button>${esc(st)}</li>`).join("");

  document.getElementById("detail").style.setProperty("--c", c.color || "");
  document.getElementById("detail").innerHTML = `
    <button class="close" aria-label="Close">✕</button>
    <h2>${esc(r.name)}</h2>
    ${metaTags(r)}
    <p class="d-desc">${esc(r.description)}</p>
    <div class="times">${times.join("")}</div>
    <h3>Ingredients
      ${r.servings ? `<span class="servings"><button data-d="-1">−</button><span>${serv} serving${serv > 1 ? "s" : ""}</span><button data-d="1">+</button></span>` : ""}
    </h3>
    <div class="hint">Tap items to check them off.</div>
    ${ings}
    <h3>Steps</h3>
    <ol class="steps">${steps}</ol>
    ${r.tips?.length ? `<h3>Tips</h3><ul class="tips">${r.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
    ${r.source ? `<div class="source">Source: ${r.source.url ? `<a href="${esc(r.source.url)}" target="_blank" rel="noopener">${esc(r.source.label || r.source.url)}</a>` : esc(r.source.label)}</div>` : ""}
  `;
  const d = document.getElementById("detail");
  d.querySelector(".close").onclick = closeDetail;
  d.querySelectorAll("li[data-id]").forEach(li => li.onclick = () => {
    const id = li.dataset.id;
    done.has(id) ? done.delete(id) : done.add(id);
    li.classList.toggle("done");
  });
  d.querySelectorAll(".ask-step").forEach(b => b.onclick = e => {
    e.stopPropagation();
    openChat(Number(b.dataset.step));
  });
  d.querySelectorAll(".servings button").forEach(b => b.onclick = () => {
    state.servings[s] = Math.max(1, serv + Number(b.dataset.d));
    openDetail(s);
  });
  ov.classList.add("open");
  document.body.style.overflow = "hidden";
  syncChat();
}

// =====================================================================
// AI chat (Gemini API, free tier). The key is restricted in Google Cloud to
// this site's referrer + the Generative Language API, on a project with no
// billing — so the worst case if someone copies it is hitting the free quota.
// =====================================================================
// Google aliases for the current models; the second is a fallback when the first is overloaded.
const GEMINI_MODELS = ["gemini-flash-latest", "gemini-flash-lite-latest"];
const GEMINI_KEY_ENC = "d2tBWUJHUzNMNjd4ZjZFZzFhSnVXS1dEdlpRODcwWnItRzRfZWdUWVRMZ0o2TlI4YkEuUUE=";   // see CLAUDE.md -> "AI chat" for how to set this
const unhash = enc => atob(enc).split("").reverse().join("");

const HOME = "__home";
// history: slug (or HOME) -> [{role: "user"|"model"|"error", text, failed?}]
// "error" entries and failed questions are shown in the chat but never sent to the API.
const chatState = { slug: HOME, step: null, history: {}, pending: null };   // pending: slug awaiting an answer
const openRecipeSlug = () => {
  const h = location.hash.slice(1);
  return document.getElementById("overlay").classList.contains("open") && DATA.some(r => slug(r.name) === h) ? h : HOME;
};

function recipeContext(s) {
  const r = DATA.find(x => slug(x.name) === s);
  const serv = state.servings[s] ?? r.servings ?? 1;
  const scale = r.servings ? serv / r.servings : 1;
  const done = state.done[s] || new Set();
  const lines = [`RECIPE: ${r.name}`, r.description];
  if (r.equipment?.length) lines.push(`Equipment: ${r.equipment.join(", ")}`);
  lines.push(`Making ${serv} serving(s).`, "", "INGREDIENTS:");
  r.ingredients.forEach((g, gi) => {
    if (g.group) lines.push(`[${g.group}]`);
    g.items.forEach((i, ii) => {
      const q = i.qty != null ? `${fmtQty(i.qty * scale)}${i.unit ? " " + i.unit : ""} ` : "";
      lines.push(`- ${q}${i.item}${i.note ? " (" + i.note + ")" : ""}${done.has(`i${gi}-${ii}`) ? " [checked off]" : ""}`);
    });
  });
  lines.push("", "STEPS:");
  r.steps.forEach((st, si) => lines.push(`${si + 1}. ${st}${done.has("s" + si) ? " [done]" : ""}`));
  if (r.tips?.length) lines.push("", "TIPS:", ...r.tips.map(t => "- " + t));
  return lines.join("\n");
}

function homeContext() {
  return "RECIPES ON THIS SITE:\n" + DATA.map(r =>
    `- ${r.name} [${(catMap[r.category] || {}).label || r.category}; ${fmtMin(totalTime(r))}; ${(r.equipment || []).join(", ")}]: ${r.description} Ingredients: ${allIngs(r).map(i => i.item).join(", ")}`).join("\n");
}

function systemPrompt(s) {
  if (s === HOME) return `You are a friendly, practical cooking helper on a small personal recipe site focused on easy, low-cleanup cooking. The user hasn't opened a specific recipe yet. Help them pick a recipe from the list below (e.g. based on ingredients they have or time available), or answer general cooking questions. Answer briefly, in plain text without markdown headers.\n\n${homeContext()}`;
  return `You are a friendly, practical cooking helper embedded in a recipe page. The user is cooking the recipe below right now, possibly mid-step with messy hands, so answer briefly (usually 1-4 sentences or a short list), concretely, and in plain text without markdown headers. These recipes prioritize ease and minimal cleanup — prefer substitutions and fixes that keep it that way. If a substitution would meaningfully change the result, say how. If something is unsafe (e.g. undercooked meat), say so clearly.\n\n${recipeContext(s)}`;
}

function drawChat() {
  const box = document.getElementById("chat-msgs");
  const hist = chatState.history[chatState.slug] || [];
  const thinking = chatState.pending === chatState.slug ? `<div class="msg model typing">Thinking…</div>` : "";
  document.querySelector("#chat-form button").disabled = !!chatState.pending;
  box.innerHTML = hist.length ? hist.map(m => `<div class="msg ${m.role}">${esc(m.text)}</div>`).join("") + thinking
    : `<div class="msg model">${chatState.slug === HOME
        ? "Hi! Tell me what ingredients you have or how much time you've got, and I'll suggest a recipe — or ask any cooking question."
        : "Hi! Ask me anything about this recipe — substitutions, timing, what to do if something went wrong."}</div>`;
  box.scrollTop = box.scrollHeight;
}

// Point the chat at whatever is on screen (a recipe, or the recipe list).
function syncChat() {
  const s = openRecipeSlug();
  if (s !== chatState.slug) chatState.step = null;
  chatState.slug = s;
  const r = DATA.find(x => slug(x.name) === s);
  document.getElementById("chat-title").textContent = r ? "Ask about this recipe" : "Ask a cooking question";
  document.getElementById("chat-sub").textContent = r
    ? r.name + (chatState.step != null ? ` · step ${chatState.step + 1}` : "")
    : "Recipe ideas, substitutions, techniques";
  document.getElementById("chat-input").placeholder = chatState.step != null ? `Question about step ${chatState.step + 1}…`
    : r ? "e.g. Can I swap the ginger for something?" : "e.g. What can I make with beef and rice?";
  if (document.getElementById("chat").classList.contains("open")) drawChat();
}

function openChat(step = null) {
  chatState.slug = openRecipeSlug();
  chatState.step = step;
  document.getElementById("chat").classList.add("open");
  document.getElementById("chat-fab").classList.add("hidden");
  syncChat();
  drawChat();
  document.getElementById("chat-input").focus();
}

function closeChat() {
  document.getElementById("chat").classList.remove("open");
  document.getElementById("chat-fab").classList.remove("hidden");
}

async function callGemini(model, body) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": unhash(GEMINI_KEY_ENC) },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  return { res, data };
}

async function askGemini(s, hist) {
  if (!GEMINI_KEY_ENC) throw new Error("Chat isn't set up yet (no API key configured).");
  const body = {
    systemInstruction: { parts: [{ text: systemPrompt(s) }] },
    contents: hist.filter(m => m.role !== "error" && !m.failed)
      .map(m => ({ role: m.role, parts: [{ text: m.text }] }))
  };
  let last;
  // Overloaded (503) / server errors: retry once, then try the fallback model.
  for (const model of GEMINI_MODELS) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try { last = await callGemini(model, body); }
      catch { last = null; continue; }   // network hiccup
      const { res, data } = last;
      if (res.ok) {
        const text = (data.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("").trim();
        if (text) return text;
        throw new Error("No answer came back — try rephrasing.");
      }
      if (res.status < 500 && res.status !== 429) throw new Error(data.error?.message || `Request failed (${res.status}).`);
      if (res.status === 429) break;   // this model's quota is used up; try the next one
      await new Promise(r => setTimeout(r, 1200));
    }
  }
  if (!last) throw new Error("Couldn't reach Gemini — check your connection and tap Send again.");
  if (last.res.status === 429) throw new Error("Free-tier limit hit — wait a minute and tap Send again.");
  throw new Error("Gemini is overloaded right now — wait a few seconds and tap Send again.");
}

document.getElementById("chat-close").onclick = closeChat;
document.getElementById("chat-fab").onclick = () => openChat();
document.getElementById("chat-form").onsubmit = async e => {
  e.preventDefault();
  const input = document.getElementById("chat-input");
  const btn = e.target.querySelector("button");
  const q = input.value.trim();
  if (!q || chatState.pending) return;
  const s = chatState.slug;
  const hist = chatState.history[s] ||= [];
  const prefix = chatState.step != null ? `(I'm on step ${chatState.step + 1}) ` : "";
  const entry = { role: "user", text: prefix + q };
  hist.push(entry);
  chatState.step = null;   // step context applies to the first question only
  chatState.pending = s;
  input.value = "";
  syncChat();
  drawChat();
  try {
    hist.push({ role: "model", text: await askGemini(s, hist) });
  } catch (err) {
    // Keep the question visible but out of the API history (which must alternate user/model).
    entry.failed = true;
    hist.push({ role: "error", text: err.message });
    if (chatState.slug === s && !input.value) input.value = q;
  } finally {
    chatState.pending = null;
    drawChat();
  }
};

function closeDetail() {
  history.pushState("", document.title, location.pathname + location.search);
  openDetail(null);
}

document.getElementById("overlay").onclick = e => { if (e.target.id === "overlay") closeDetail(); };
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.getElementById("chat").classList.contains("open")) closeChat(); else closeDetail();
});
// ---- Ingredient chip input ----
(() => {
  const box = document.getElementById("ing-search");
  const input = document.getElementById("ing-input");
  const list = document.getElementById("suggest");
  const chips = document.getElementById("chips");
  let items = [], active = -1;

  function drawChips() {
    chips.innerHTML = state.ings.map((c, i) =>
      `<span class="chip">${esc(c)}<button data-i="${i}" aria-label="Remove">×</button></span>`).join("");
    chips.querySelectorAll("button").forEach(b => b.onclick = e => {
      e.stopPropagation();
      state.ings.splice(Number(b.dataset.i), 1);
      drawChips(); render(); input.focus();
    });
  }
  function drawList() {
    const q = input.value.trim();
    items = q ? suggestions(q) : [];
    const g = q && genericOption(q);
    if (g) items.unshift(g);
    active = items.length ? 0 : -1;
    list.innerHTML = items.map((x, i) => `<li data-i="${i}" class="${i === active ? "active" : ""}">
        <span>${x.any ? `Any “${esc(x.e.item)}”` : esc(x.e.item)}${x.via ? ` <span class="via">${esc(x.via)}</span>` : ""}</span>
        <span class="n">${x.e.recipes.size} recipe${x.e.recipes.size > 1 ? "s" : ""}</span></li>`).join("")
      || (q ? `<li data-raw="1"><span>Add “${esc(q)}”</span><span class="n">no exact match</span></li>` : "");
    list.classList.toggle("open", !!q);
    list.querySelectorAll("li").forEach(li => li.onmousedown = e => {
      e.preventDefault();
      add(li.dataset.raw ? input.value.trim() : items[Number(li.dataset.i)].e.item);
    });
  }
  function highlight() {
    list.querySelectorAll("li").forEach((li, i) => li.classList.toggle("active", i === active));
  }
  function add(term) {
    if (!term) return;
    if (!state.ings.some(c => c.toLowerCase() === term.toLowerCase())) state.ings.push(term);
    input.value = "";
    drawChips(); drawList(); render(); input.focus();
  }

  box.onclick = () => input.focus();
  input.oninput = drawList;
  input.onblur = () => list.classList.remove("open");
  input.onfocus = () => { if (input.value.trim()) drawList(); };
  input.onkeydown = e => {
    if (e.key === "ArrowDown" && items.length) { active = (active + 1) % items.length; highlight(); e.preventDefault(); }
    else if (e.key === "ArrowUp" && items.length) { active = (active - 1 + items.length) % items.length; highlight(); e.preventDefault(); }
    else if (e.key === "Enter") { e.preventDefault(); add(active >= 0 ? items[active].e.item : input.value.trim()); }
    else if (e.key === "Backspace" && !input.value && state.ings.length) { state.ings.pop(); drawChips(); render(); }
    else if (e.key === "Escape") { input.value = ""; list.classList.remove("open"); e.stopPropagation(); }
  };
  document.getElementById("ing-clear").onclick = () => { state.ings = []; input.value = ""; drawChips(); drawList(); render(); };
})();

document.getElementById("search").oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };
window.addEventListener("hashchange", () => openDetail(location.hash.slice(1)));

buildFilters();
render();
if (location.hash) openDetail(location.hash.slice(1));
</script>
